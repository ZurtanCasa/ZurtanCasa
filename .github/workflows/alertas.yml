name: Alertas de Reservas (WhatsApp)

on:
  schedule:
    - cron: '0 12 * * *'   # 09:00 UY (UTC-3): avisa las entregas de mañana
  workflow_dispatch:

jobs:
  alertas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Enviar alertas de entregas de mañana
        env:
          CALLMEBOT_APIKEY_1: ${{ secrets.CALLMEBOT_APIKEY_1 }}
          CALLMEBOT_APIKEY_2: ${{ secrets.CALLMEBOT_APIKEY_2 }}
        run: python scripts/alertas_reservas.py

      - name: Commit registro de alertas
        run: |
          git config user.name "zurtancasa-bot"
          git config user.email "bot@zurtancasa.com"
          git pull --rebase --autostash origin main || true
          git add data/alertas_enviadas.json
          git diff --cached --quiet || git commit -m "chore: registro de alertas de reservas $(TZ='America/Montevideo' date '+%Y-%m-%d %H:%M UY')"
          git push
